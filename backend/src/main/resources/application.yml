spring:
  application:
    name: gestion-hotel-backend
  datasource:
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:HOTEL_APP_DEV}
    password: ${ORACLE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${ORACLE_SCHEMA:HOTEL_APP_DEV}
  sql:
    init:
      mode: never

server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  bootstrap-admin:
    login: ${APP_BOOTSTRAP_ADMIN_LOGIN:}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    first-name: ${APP_BOOTSTRAP_ADMIN_FIRST_NAME:}
    last-name: ${APP_BOOTSTRAP_ADMIN_LAST_NAME:}
